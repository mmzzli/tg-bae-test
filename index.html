<!doctype html>
<html
  lang="en"
  style="
    --tg-safe-area-inset-top: 0px;
    --tg-content-safe-area-inset-top: 0px;
    --tg-safe-area-inset-bottom: 0px;
    --tg-content-safe-area-inset-bottom: 0px;
  "
>
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#ff0000" />
    <link rel="icon" href="/vite.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://at.alicdn.com/t/c/font_4749276_5u0c5l7kh1i.css" />
    <title>Bae</title>
  </head>
  <body style="background-color: #ffffff">
    <!-- Main app container -->
    <div id="root" style="position: relative; z-index: 10; width: 100vw; height: 100vh"></div>

    <!-- Video splash screen -->
    <div
      id="splash_video"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 50;
        background-color: #ffffff;
      "
    >
      <video
        id="splash_video_dom"
        autoplay
        muted
        preload="auto"
        playsinline
        style="
          position: absolute;
          top: 0;
          left: 0;
          object-fit: cover;
          width: 100vw;
          height: 100vh;
          z-index: 50;
        "
      >
        <source src="/bae_loading_2.mov" type="video/mp4" />
      </video>
    </div>

    <!-- Play Button -->
    <div id="btn" style="color: #000; cursor: pointer" aria-label="Play Video"></div>

    <!-- Scripts -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"
      async
    ></script>
    <script src="https://at.alicdn.com/t/c/font_4749304_ljhtroq82h.js" async></script>
    <!-- <script src="https://telegram.org/js/telegram-web-app.js" async></script> -->
    <script src="/js/tma.js" async></script>
    <script type="module" src="/src/main.tsx" async></script>

    <script>
      window.loading = true
      const videoDom = document.getElementById('splash_video_dom')
      const playBtn = document.getElementById('btn')

      // Play button event listener
      playBtn.addEventListener('click', function (e) {
        e.preventDefault()
        if (videoDom.paused && !videoDom.ended) {
          videoDom.play()
        }
        if (!videoDom.paused) {
          clearTimeout(timer)
        }
      })

      // Timer to trigger play button click after a short delay
      const timer = setTimeout(() => {
        playBtn.click()
      }, 100)
    </script>
  </body>
</html>
