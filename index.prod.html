<!doctype html>
<html
  lang="en"
  style="
    --tg-safe-area-inset-top: 0px;
    --tg-content-safe-area-inset-top: 0px;
    --tg-safe-area-inset-bottom: 0px;
    --tg-content-safe-area-inset-bottom: 0px;
  "
>
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0,user-scalable=no"
    />
    <meta name="theme-color" content="#ff0000" />
    <link rel="stylesheet" href="https://at.alicdn.com/t/c/font_4749276_th09955bdve.css" />
    <title>DITTO</title>
  </head>
  <body>
    <div id="btn" style="color: #000"></div>
    <div id="root" style="position: relative; z-index: 9; width: 100vw; height: 100vh"></div>
    <div
      id="splash_video"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 9999;
        background-color: #ffffff;
      "
    >
      <video
        id="splash_video_dom"
        autoplay
        muted
        preload="auto"
        playsinline
        webkit-playsinline="true"
        style="
          position: absolute;
          top: 0;
          left: 0;
          z-index: 9999;
          object-fit: cover;
          width: 100vw;
          height: 100vh;
          -webkit-appearance: none;
          ::-webkit-media-controls {
            display: none !important;
          }
        "
      >
        <source src="https://img.bae.boo/bae_loading_1.mov" type="video/mp4" />
      </video>
    </div>
    <script>
      window.loading = true
      const videoDom = document.getElementById('splash_video_dom')
      const palyBtn = document.getElementById('btn')

      palyBtn.addEventListener('click', function (e) {
        e.preventDefault()
        if (video.paused && !video.ended) {
          video.play()
        }
        if (!video.paused) {
          clearInterval(timer)
        }
      })

      const timer = setTimeout(() => {
        palyBtn.click()
      }, 100)
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
    <script src="https://at.alicdn.com/t/c/font_4749304_ljhtroq82h.js"></script>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </body>
</html>
