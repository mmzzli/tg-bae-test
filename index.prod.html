<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#ff0000" />
    <link rel="icon" href="/vite.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://at.alicdn.com/t/c/font_4749276_th09955bdve.css" />
    <title>Bae</title>
  </head>
  <body style="background-color: #ffffff;">
    <!-- Main app container -->
    <div id="root" style="position: relative; z-index: 10; width: 100vw; height: 100vh;"></div>

    <!-- Video splash screen -->
    <div
      id="splash_video"
      style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 50; background-color: #ffffff;"
    >
      <video
        id="splash_video_dom"
        autoplay
        muted
        preload="auto"
        playsinline
        style="position: absolute; top: 0; left: 0; object-fit: cover; width: 100vw; height: 100vh; z-index: 50;"
      >
        <source src="https://img.bae.boo/bae_loading_1.mov" type="video/mp4" />
      </video>
    </div>

    <!-- Play Button -->
    <div
      id="btn"
      style="color: #000; cursor: pointer;"
      aria-label="Play Video"
    ></div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js" async></script>
    <script src="https://at.alicdn.com/t/c/font_4749304_ljhtroq82h.js" async></script>
    <script src="https://telegram.org/js/telegram-web-app.js" async></script>
    <script type="module" src="/src/main.tsx" async></script>

    <script>
      window.loading = true;
      const videoDom = document.getElementById('splash_video_dom');
      const playBtn = document.getElementById('btn');

      // Play button event listener
      playBtn.addEventListener('click', function (e) {
        e.preventDefault();
        if (videoDom.paused && !videoDom.ended) {
          videoDom.play();
        }
        if (!videoDom.paused) {
          clearTimeout(timer);
        }
      });

      // Timer to trigger play button click after a short delay
      const timer = setTimeout(() => {
        playBtn.click();
      }, 100);

      // Function to create a video canvas
      function createVideoCanvas(videoUrl, containerId) {
        const container = document.getElementById(containerId);
        const canvas = document.createElement('canvas');
        const video = document.createElement('video');
        const ctx = canvas.getContext('2d');

        // Set video element styles
        video.style.position = 'absolute';
        video.style.top = '0';
        video.style.left = '0';
        video.style.zIndex = '9999';
        video.style.objectFit = 'cover';
        video.style.width = '100vw';
        video.style.height = '100vh';

        // Set up video attributes
        video.src = videoUrl;
        video.muted = true;
        video.autoplay = true;
        video.playsInline = true;
        video.setAttribute('playsinline', '');
        video.setAttribute('webkit-playsinline', '');

        // Append video and canvas to the container
        container.appendChild(canvas);
        container.appendChild(video);

        // Video load event
        video.addEventListener('loadedmetadata', () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          canvas.style.width = '100%';
          canvas.style.height = 'auto';
        });

        // Render function to draw video frame to canvas
        function render() {
          if (!video.paused && !video.ended) {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            requestAnimationFrame(render);
          } else if (video.ended) {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          }
        }

        // Start rendering on video play
        video.addEventListener('play', render);

        // Error handling
        video.addEventListener('error', (e) => {
          console.error('Video error:', e);
        });

        // Cleanup function
        return () => {
          video.pause();
          video.src = '';
          container.removeChild(canvas);
          container.removeChild(video);
        };
      }

      // Optionally, call the cleanup function for video canvas
      // window.canvasPlayerCleanup = createVideoCanvas('https://img.bae.boo/bae_loading_1.mov', 'splash_video');
    </script>
  </body>
</html>
